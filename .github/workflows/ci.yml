name: GIS lab CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      demo_url:
        description: Optional public Render URL to smoke test
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      LAB_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=backend-test-results.xml
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: google-chrome --version
      - run: npm test -- --reporter=line,junit
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: browser-test-results.xml
      - name: Build and smoke-test the Render image
        run: |
          docker build --tag transportation-gis-lab:ci .
          container=$(docker run --detach --publish 127.0.0.1:8766:10000 transportation-gis-lab:ci)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8766/healthz
          curl --fail --silent --show-error http://127.0.0.1:8766/ | grep 'Transportation GIS'
      - run: npm test -- --reporter=line,junit
        if: ${{ inputs.demo_url != '' }}
        working-directory: frontend
        env:
          LAB_BASE_URL: ${{ inputs.demo_url }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: public-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend-test-results.xml
            frontend/*-test-results.xml
            frontend/test-results/
